<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Grupo Nossa Farmácia</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  // O site antigo de grupo.nossafarmacia.pt passou para portal.nossafarmacia.pt. Os caminhos dele
  // começam por maiúscula (/Portal, /NossasFarmacias/, /Emprego/, …): esses seguem para lá.
  // Os restantes mostram esta página.
  if (location.hostname === 'grupo.nossafarmacia.pt' && /^\/[A-Z]/.test(location.pathname)) {
    location.replace('https://portal.nossafarmacia.pt' + location.pathname + location.search + location.hash);
  }
</script>
<style>
  :root{color-scheme:light;--dark:#0B2720;--emerald:#009B77;--paper:#F4F8F6;--ink:#0E1E1A;--ink-2:#3C4D49}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:400 17px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:24px}
  main{max-width:520px;text-align:center}
  img{width:64px;height:64px}
  h1{font-size:clamp(26px,5vw,34px);line-height:1.15;letter-spacing:-.02em;margin:24px 0 12px}
  p{color:var(--ink-2);margin:0 0 8px}
  a{display:inline-block;margin-top:24px;padding:12px 22px;border-radius:999px;background:var(--dark);color:#fff;text-decoration:none;font-weight:600}
  a:focus-visible{outline:3px solid var(--emerald);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="favicon.svg" alt="" width="64" height="64">
  <h1>Página não encontrada</h1>
  <p>O endereço que procura não existe ou mudou de sítio.</p>
  <p lang="en">The page you are looking for does not exist or has moved.</p>
  <a href="./">Ir para a página inicial</a>
</main>
</body>
</html>
